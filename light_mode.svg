<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="560px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #d9480f;}
.value {fill: #0969da;}
.addColor {fill: #1a7f37;}
.delColor {fill: #cf222e;}
.cc {fill: #8c959f;}
text, tspan {white-space: pre;}
</style>
<rect width="985px" height="560px" fill="#f6f8fa" rx="15" />
<text xml:space="preserve" x="15" y="30" fill="#24292f" class="ascii">
<tspan x="15" y="30">        .-------------------------.</tspan>
<tspan x="15" y="50">        |  .-------------------.  |</tspan>
<tspan x="15" y="70">        |  | $ whoami          |  |</tspan>
<tspan x="15" y="90">        |  | &gt; your-name       |  |</tspan>
<tspan x="15" y="110">        |  | $ ls projects/    |  |</tspan>
<tspan x="15" y="130">        |  | app/  bot/  site/ |  |</tspan>
<tspan x="15" y="150">        |  | $ _               |  |</tspan>
<tspan x="15" y="170">        |  '-------------------'  |</tspan>
<tspan x="15" y="190">        '--.-------------------.--'</tspan>
<tspan x="15" y="210">       .---'                   '---.</tspan>
<tspan x="15" y="230">      /  .-------------------.     \</tspan>
<tspan x="15" y="250">     /  /_____________________\     \</tspan>
<tspan x="15" y="270">    /________________________________\</tspan>
<tspan x="15" y="290">    '--------------------------------'</tspan>
</text>
<text xml:space="preserve" x="400" y="30" fill="#24292f">
<tspan x="400" y="30">yourname@github</tspan> <tspan class="cc">-------------------------------------</tspan>
<tspan x="400" y="50" class="key">OS</tspan>:<tspan class="cc"> .................... </tspan><tspan class="value">Windows 11, Ubuntu, Android</tspan>
<tspan x="400" y="70" class="key">Host</tspan>:<tspan class="cc"> ....................... </tspan><tspan class="value">Your College / Company</tspan>
<tspan x="400" y="90" class="key">Kernel</tspan>:<tspan class="cc"> ................... </tspan><tspan class="value">Your Job Title / Student</tspan>
<tspan x="400" y="110" class="key">IDE</tspan>:<tspan class="cc"> ............................... </tspan><tspan class="value">VS Code, Neovim</tspan>
<tspan x="400" y="130" class="key">Uptime</tspan>:<tspan class="cc" id="age_data_dots"> ................ </tspan><tspan class="value" id="age_data">26 years, 9 months, 19 days</tspan>
<tspan x="400" y="170">- Languages</tspan> <tspan class="cc">-----------------------------------------</tspan>
<tspan x="400" y="190" class="key">Languages.Programming</tspan>:<tspan class="cc"> ..... </tspan><tspan class="value">Python, JavaScript, C++</tspan>
<tspan x="400" y="210" class="key">Languages.Computer</tspan>:<tspan class="cc"> ....... </tspan><tspan class="value">HTML, CSS, SQL, Markdown</tspan>
<tspan x="400" y="230" class="key">Languages.Real</tspan>:<tspan class="cc"> ............ </tspan><tspan class="value">English, Hindi, Konkani</tspan>
<tspan x="400" y="270">- Hobbies</tspan> <tspan class="cc">-------------------------------------------</tspan>
<tspan x="400" y="290" class="key">Hobbies.Software</tspan>:<tspan class="cc"> .......... </tspan><tspan class="value">Open source, Automation</tspan>
<tspan x="400" y="310" class="key">Hobbies.Hardware</tspan>:<tspan class="cc"> .......... </tspan><tspan class="value">Raspberry Pi, Keyboards</tspan>
<tspan x="400" y="350">- Contact</tspan> <tspan class="cc">-------------------------------------------</tspan>
<tspan x="400" y="370" class="key">Contact.Email</tspan>:<tspan class="cc"> ..................... </tspan><tspan class="value">you@example.com</tspan>
<tspan x="400" y="390" class="key">Contact.LinkedIn</tspan>:<tspan class="cc"> ............. </tspan><tspan class="value">your-linkedin-handle</tspan>
<tspan x="400" y="410" class="key">Contact.Discord</tspan>:<tspan class="cc"> ...................... </tspan><tspan class="value">your_discord</tspan>
<tspan x="400" y="450">- GitHub Stats</tspan> <tspan class="cc">--------------------------------------</tspan>
<tspan x="400" y="470" class="key">Repos</tspan>:<tspan class="cc" id="repo_data_dots"> .......................................... </tspan><tspan class="value" id="repo_data">21</tspan>
<tspan x="400" y="490" class="key">Stars</tspan>:<tspan class="cc" id="star_data_dots"> ........................................... </tspan><tspan class="value" id="star_data">3</tspan>
<tspan x="400" y="510" class="key">Followers</tspan>:<tspan class="cc" id="follower_data_dots"> ...................................... </tspan><tspan class="value" id="follower_data">10</tspan>
<tspan x="400" y="530" class="key">Commits</tspan>:<tspan class="cc" id="commit_data_dots"> ....................................... </tspan><tspan class="value" id="commit_data">122</tspan>
</text>
</svg>